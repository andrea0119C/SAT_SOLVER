
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SAT SOLVER | Java Edition</title>

    <!-- Hoja de estilos principal -->
    <link rel="stylesheet" href="css/styles.css">

    <!-- Fuente pixelada -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap"
          rel="stylesheet">
</head>

<body class="home">

    <!-- ========== PORTADA PRINCIPAL ========== -->
    <main class="start">

        <!-- Título principal -->
        <header class="home-header">

            <div class="logo-container">
                <h1>SAT <span>SOLVER</span></h1>

                <p class="edition">JAVA EDITION</p>

                <p class="splash">
                    ¡Pon a prueba tu lógica!
                </p>
            </div>

        </header>

        <!-- ========== MENÚ DE NAVEGACIÓN ========== -->

        <nav class="main-menu" aria-label="Menú principal">

            <a class="game-button primary" href="panel.html#resolver">
                <span class="pixel-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" class="icon-svg">
                        <!-- pieza tipo bloque/puzzle -->
                        <rect x="8" y="4" width="4" height="4"/>
                        <rect x="12" y="4" width="4" height="4"/>
                        <rect x="16" y="4" width="4" height="4"/>

                        <rect x="4" y="8" width="4" height="4"/>
                        <rect x="8" y="8" width="4" height="4"/>
                        <rect x="12" y="8" width="4" height="4"/>
                        <rect x="16" y="8" width="4" height="4"/>
                        <rect x="20" y="8" width="4" height="4"/>

                        <rect x="4" y="12" width="4" height="4"/>
                        <rect x="8" y="12" width="4" height="4"/>
                        <rect x="12" y="12" width="4" height="4"/>
                        <rect x="16" y="12" width="4" height="4"/>
                        <rect x="20" y="12" width="4" height="4"/>

                        <rect x="8" y="16" width="4" height="4"/>
                        <rect x="12" y="16" width="4" height="4"/>
                        <rect x="16" y="16" width="4" height="4"/>

                        <rect x="12" y="20" width="4" height="4"/>
                    </svg>
                </span>
                <span>Resolver SAT</span>
            </a>

            <a class="game-button" href="panel.html#verificar">
                <span class="pixel-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" class="icon-svg">
                        <!-- check pixel -->
                        <rect x="4" y="16" width="4" height="4"/>
                        <rect x="8" y="20" width="4" height="4"/>
                        <rect x="12" y="24" width="4" height="4"/>
                        <rect x="16" y="20" width="4" height="4"/>
                        <rect x="20" y="16" width="4" height="4"/>
                        <rect x="24" y="12" width="4" height="4"/>
                    </svg>
                </span>
                <span>Verificar asignación</span>
            </a>

            <a class="game-button" href="panel.html#ejemplos">
                <span class="pixel-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" class="icon-svg">
                        <!-- libro/documento -->
                        <rect x="8" y="4" width="4" height="4"/>
                        <rect x="12" y="4" width="4" height="4"/>
                        <rect x="16" y="4" width="4" height="4"/>

                        <rect x="8" y="8" width="4" height="4"/>
                        <rect x="20" y="8" width="4" height="4"/>

                        <rect x="8" y="12" width="4" height="4"/>
                        <rect x="20" y="12" width="4" height="4"/>

                        <rect x="8" y="16" width="4" height="4"/>
                        <rect x="20" y="16" width="4" height="4"/>

                        <rect x="8" y="20" width="4" height="4"/>
                        <rect x="20" y="20" width="4" height="4"/>

                        <rect x="8" y="24" width="4" height="4"/>
                        <rect x="12" y="24" width="4" height="4"/>
                        <rect x="16" y="24" width="4" height="4"/>
                        <rect x="20" y="24" width="4" height="4"/>

                        <rect x="12" y="10" width="8" height="2"/>
                        <rect x="12" y="16" width="8" height="2"/>
                    </svg>
                </span>
                <span>Probar ejemplos</span>
            </a>

            <a class="game-button" href="panel.html#rendimiento">
                <span class="pixel-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" class="icon-svg">
                        <!-- grafico barras -->
                        <rect x="4" y="24" width="4" height="4"/>
                        <rect x="8" y="20" width="4" height="8"/>
                        <rect x="14" y="16" width="4" height="12"/>
                        <rect x="20" y="10" width="4" height="18"/>
                        <rect x="26" y="6" width="4" height="22"/>
                    </svg>
                </span>
                <span>Análisis de rendimiento</span>
            </a>

            <a class="game-button" href="panel.html#ayuda">
                <span class="pixel-icon" aria-hidden="true">
                    <svg viewBox="0 0 32 32" class="icon-svg">
                        <!-- estrella/pixel spark -->
                        <rect x="12" y="0" width="4" height="4"/>
                        <rect x="12" y="4" width="4" height="4"/>
                        <rect x="0" y="12" width="4" height="4"/>
                        <rect x="4" y="12" width="4" height="4"/>
                        <rect x="12" y="12" width="4" height="4"/>
                        <rect x="20" y="12" width="4" height="4"/>
                        <rect x="24" y="12" width="4" height="4"/>
                        <rect x="12" y="20" width="4" height="4"/>
                        <rect x="12" y="24" width="4" height="4"/>
                    </svg>
                </span>
                <span>Ayuda e instrucciones</span>
            </a>

        </nav>

        <!-- ========== PIE DE PÁGINA ========== -->
        <footer class="home-footer">

            <p>
                Proyecto Integrador | Estructura de Datos
                y Algoritmos II
            </p>

            <p>
                SAT SOLVER © 2026
            </p>

        </footer>

    </main>

</body>
</html>
